name: build-finalpool

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble final pool of implemented tasks
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin finalpool
          git checkout -B finalpool origin/finalpool
          rm -rf tasks/finalpool
          mkdir -p tasks/finalpool
          printf 'Final pool of implemented tasks from BenchTasksCollv3 (checked against tasks/examples requirements).\n' > tasks/finalpool/readme.txt
          pairs="fan-dev:fan gyy:gyy haoze:haoze jl_dev:jl junteng_dev:junteng junxian_dev:junxian lueyang-dev:lueyang lv:lv ruige:ruige wenshuo-dev:wenshuo xiaochen_dev:xiaochen yuxuan-dev:yuxuan yuzhen-dev:yuzhen zhaochen:zhaochen"
          tasks="activity-logger alert-system analytics-dashboard asset-optimizer backup-utility blog-engine booking-system cache-optimizer calendar-sync canvas-automation canvas-grade-automation certificate-manager chat-bot client-portal cms-builder contact-manager content-manager content-scheduler coupon-manager crm-system customer-feedback-processor data-analytics data-validator deal-manager deployment-tool discount-calculator email-campaign email-classification-system error-tracker expense-tracker feedback-collector file-manager follow-up-reminder form-builder health-monitor help-desk image-processor inventory-management invoice-generator load-balancer log-analyzer loyalty-program media-organizer monitoring-agent network-analyzer order-processor payment-processor pdf-report-generator permission-manager personalization-service price-tracker product-catalog qr-generator reminder-service robots-handler sales-pipeline scheduler search-engine security-scanner sentiment-analyzer shipment-tracker social-connector social-publisher status-checker storage-manager streaming-service subtitle-generator survey-builder sync-service tag-manager task-scheduler template-engine territory-manager translation-api video-trimmer voice-processor web-crawler"
          n=0
          for t in $tasks; do
            found=""
            for p in $pairs; do
              b="${p%%:*}"
              d="${p##*:}"
              if git cat-file -e "origin/${b}:tasks/${d}/${t}" 2>/dev/null; then
                found="$p"
                break
              fi
            done
            if [ -z "$found" ]; then
              echo "::error::task not found in any dev branch: $t"
              exit 1
            fi
            b="${found%%:*}"
            d="${found##*:}"
            mkdir -p "tasks/finalpool/$t"
            git archive "origin/${b}" "tasks/${d}/${t}" | tar -x -C "tasks/finalpool/$t" --strip-components=3
            n=$((n+1))
          done
          echo "Assembled $n tasks"
          git add tasks/finalpool
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add finalpool: $n implemented tasks under tasks/finalpool"
            git push origin finalpool
          fi
